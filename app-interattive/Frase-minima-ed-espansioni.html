<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>La frase minima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f8;--fg:#14233b;--card:#fff;--line:#c9d4e2;--acc:#0b5cad;--ok:#17653a;--okbg:#d9f2e3;--ko:#a3281d;--kobg:#fbe2df;--mut:#51627a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101722;--fg:#eaf0f8;--card:#1a2433;--line:#32445c;--acc:#5aa9ff;--ok:#6fdc9c;--okbg:#14382a;--ko:#ff8f84;--kobg:#42201d;--mut:#9fb0c6}}
:root[data-theme="dark"]{--bg:#101722;--fg:#eaf0f8;--card:#1a2433;--line:#32445c;--acc:#5aa9ff;--ok:#6fdc9c;--okbg:#14382a;--ko:#ff8f84;--kobg:#42201d;--mut:#9fb0c6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:.3em 0 .6em}h2{font-size:1.05rem;margin:1.2em 0 .5em;color:var(--mut);font-weight:700}
[hidden]{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn,.opt{font:inherit;color:var(--fg);cursor:pointer}
.chip{padding:10px 16px;border:2px solid var(--line);background:var(--card);border-radius:999px}
.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#07213d}}
:root[data-theme="dark"] .chip.on{color:#07213d}
.btn{padding:14px 22px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;margin-top:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#07213d}}

.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0 14px}.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px;transition:width .3s}
#tag{font-weight:700;color:var(--acc)}
#prompt{background:var(--card);border:2px solid var(--line);border-radius:16px;text-align:center;padding:20px 10px;font-size:1.7rem;line-height:1.5;margin:8px 0 14px}
#prompt small{font-size:1rem;color:var(--mut)}.em{font-size:3rem}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:68px;font-size:1.2rem;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:8px}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ko{border-color:var(--ko);background:var(--kobg)}
.fb{min-height:3.2em;margin-top:12px;font-size:1.05rem}.fb.g{color:var(--ok)}.fb.b{color:var(--ko)}
#end ul{padding-left:1.2em}#res{font-size:2.4rem;font-weight:700;margin:.2em 0}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin:8px 0}
.wd{padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);font:inherit;color:var(--fg);cursor:pointer;font-size:1.15rem}
.wd:disabled{opacity:.7}
#ans{width:100%;box-sizing:border-box;font:inherit;font-size:1.25rem;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
#prompt{font-size:1.35rem}.def{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:1rem}
#opts{grid-template-columns:1fr 1fr}
.btn.alt{border:2px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.alt{color:var(--fg);background:var(--card)}}
:root[data-theme="dark"] .btn.alt{color:var(--fg);background:var(--card)}
</style></head><body><div class="w">
<section id="menu"><h1>La frase minima</h1>
<div class="def">Una frase minima ha un <b>soggetto</b> (chi fa l’azione), un <b>verbo</b> (che cosa fa) e un’<b>espansione</b> (che cosa, dove, quando, con chi, come). Esempio: <b>Marco</b> <b>suona</b> <b>la chitarra</b>.</div>
<div id="cfg"></div><button class="btn" id="go">Gioca</button></section>
<section id="play" hidden><div class="top"><span id="cnt"></span><span id="sc"></span><button class="chip" id="mu" style="padding:2px 12px;font-size:.9rem" aria-label="Suoni sì/no">🔔 Suoni</button></div><div class="bar"><i id="bar"></i></div>
<div id="tag"></div><div id="prompt"></div><div id="area"></div><div class="fb" id="fb" aria-live="polite"></div><button class="btn" id="next" hidden>Avanti</button></section>
<section id="end" hidden><h1>Risultato</h1><div id="res"></div><div id="msg"></div><div id="errs"></div><button class="btn" id="again">Gioca ancora</button> <button class="btn alt" id="home">Menu</button></section>
</div><script>
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),pk=(a,n)=>sh([...new Set(a)]).slice(0,n);
let cfg={},Q=[],i=0,sc=0,er=[];
let mute=false,AC;
function snd(ok){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;(ok?[[523,0],[659,.12],[784,.24]]:[[196,0],[147,.18]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(ok?.25:.15,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+(ok?.2:.3));o.connect(g);g.connect(AC.destination);o.start(n+d);o.stop(n+d+.35)})}catch(e){}}

const D=`🧑‍💻|Io|studio|ogni sera|quando|studiare|studi|studiano|v
🌅|Mio padre|si alza|alle sei|quando|alzarsi|ti alzi|si alzano|v
📱|Loro|chattano|dopo cena|quando|chattare|chatti|chatta|p
🚶|Noi|passeggiamo|la domenica|quando|passeggiare|passeggiate|passeggia|p
💼|Io|lavoro|di mattina|quando|lavorare|lavori|lavorano|v
🎤|Anna|canta|stasera|quando|cantare|canti|cantano|p
✈️|Loro|partono|domani|quando|partire|parte|partiamo|v
🌳|Loro|camminano|nel parco|dove|camminare|cammina|camminiamo|p
🏠|Io|resto|a casa|dove|restare|resti|restano|v
🎬|Noi|andiamo|al cinema|dove|andare|andate|vanno|p
🍕|Voi|mangiate|in pizzeria|dove|mangiare|mangiano|mangio|v
📚|Sara|studia|in biblioteca|dove|studiare|studi|studiano|v
🏊|Tu|nuoti|in piscina|dove|nuotare|nuoto|nuotano|p
🛒|Mia madre|lavora|al mercato|dove|lavorare|lavori|lavorano|v
⚽|Ali|gioca|con i compagni|con chi|giocare|giochi|giocano|p
💬|Sara|chatta|con le amiche|con chi|chattare|chatti|chattano|p
🍝|Noi|cuciniamo|con la nonna|con chi|cucinare|cucinate|cucinano|p
🎸|Marco|suona|con un amico|con chi|suonare|suoni|suonano|p
🐕|Io|passeggio|con il mio cane|con chi|passeggiare|passeggi|passeggiano|p
☕|Voi|parlate|con l’insegnante|con chi|parlare|parlo|parlano|v
🎙️|Lei|canta|molto bene|come|cantare|canti|cantano|p
🚗|Io|guido|piano|come|guidare|guidi|guidano|v
🍳|Lui|cucina|volentieri|come|cucinare|cucini|cucinano|p
📖|Tu|leggi|ad alta voce|come|leggere|leggo|leggono|p
🎧|Loro|ascoltano|in silenzio|come|ascoltare|ascolta|ascoltiamo|p
🏃|Noi|corriamo|lentamente|come|correre|correte|corrono|p
🎵|Anna|ascolta|la musica|che cosa|ascoltare|ascolti|ascoltano|p
🎼|Marco|suona|la chitarra|che cosa|suonare|suoni|suonano|p
📕|Io|leggo|un libro|che cosa|leggere|leggi|leggono|p
🍞|Mia madre|compra|il pane|che cosa|comprare|compri|comprano|v
▶️|Tu|guardi|un video|che cosa|guardare|guardo|guarda|p
🍵|Voi|bevete|il tè|che cosa|bere|bevono|bevi|v`;
const B=D.split('\n').map(l=>l.split('|')).map(a=>({e:a[0],S:a[1],V:a[2],X:a[3],T:a[4],I:a[5],w2:a[6],w3:a[7],c:a[8]}));
const TL={'quando':'Quando?','dove':'Dove?','con chi':'Con chi?','come':'Come?','che cosa':'Che cosa?'};
const CL={Io:'1s',Tu:'2s',Noi:'1p',Voi:'2p',Loro:'3p'},cl=s=>CL[s]||'3s';
const TEC=[['tutte','🎲 Tutte le tecniche'],['verbo','Scegli il verbo'],['ordina','Metti in ordine'],['analisi','Soggetto, verbo, espansione'],['tipo','Che cosa indica?'],['scrivi','Scrivi il verbo'],['errore','Giusta o sbagliata?'],['emoji','Immagine e frase'],['soggetto','Trova il soggetto'],['espansione','Scegli l’espansione']];
const MENU=[{k:'tec',t:'Quale esercizio?',o:TEC},{k:'tema',t:'Di che cosa parliamo?',o:[['tutti','Tutto'],['v','Vita di ogni giorno'],['p','Passioni e tempo libero']]}];
const DEF={soggetto:'Il soggetto dice chi fa l’azione.',verbo:'Il verbo dice che cosa fa il soggetto.',espansione:'L’espansione aggiunge informazioni: che cosa, dove, quando, con chi, come.'};
function mk(x,t){const base=x.S+' '+x.V+' '+x.X,full=base+'.',em='<span class=em>'+x.e+'</span><br>';
const Z=(k,tag,h,o)=>Object.assign({k:k,t:tag,h:h,f:full,n:''},o);
if(t=='verbo')return Z('c','Scegli il verbo',em+'<b>'+x.S+' ___ '+x.X+'.</b>',{o:sh([x.V,x.I,x.w2,x.w3]),a:x.V,n:'il verbo si accorda con il soggetto: «'+x.S+' '+x.V+'», non «'+x.I+'»'});
if(t=='ordina')return x.T=='quando'?null:Z('o','Metti in ordine le parole',em,{w:base.split(' '),a:base});
if(t=='analisi'){const p=sh(['soggetto','verbo','espansione'])[0],m={soggetto:x.S,verbo:x.V,espansione:x.X};return Z('c','Analizza la frase',em+'<b>'+full+'</b><br><small>Qual è '+(p=='espansione'?'l’espansione':'il '+p)+'?</small>',{o:sh([x.S,x.V,x.X]),a:m[p],n:DEF[p]})}
if(t=='tipo')return Z('c','Che cosa indica l’espansione?',em+'<b>'+full+'</b><br><small>«'+x.X+'» risponde a…</small>',{o:sh([TL[x.T],...pk(Object.keys(TL).filter(k=>k!=x.T).map(k=>TL[k]),3)]),a:TL[x.T],n:'«'+x.X+'» risponde alla domanda «'+TL[x.T]+'»'});
if(t=='scrivi')return Z('w','Scrivi il verbo',em+'<b>'+x.S+' ___ '+x.X+'.</b><br><small>Verbo: '+x.I+'</small>',{a:x.V,n:'con «'+x.S+'» si dice «'+x.V+'», non «'+x.I+'»'});
if(t=='errore'){const bad=Math.random()<.5,wr=Math.random()<.5?x.I:x.w2;return Z('c','Giusta o sbagliata?',em+'<b>'+x.S+' '+(bad?wr:x.V)+' '+x.X+'.</b>',{o:['✅ Giusta','❌ Sbagliata'],a:bad?'❌ Sbagliata':'✅ Giusta',f:bad?'la frase è sbagliata. Giusto: '+full:'la frase è giusta.',n:bad?(wr==x.I?'il verbo va coniugato: non si usa l’infinito':'il verbo deve accordarsi con il soggetto «'+x.S+'»'):''})}
if(t=='emoji')return Z('c','Quale frase va con l’immagine?','<span class=em style="font-size:4rem">'+x.e+'</span>',{o:sh([full,...pk(B.filter(y=>y.e!=x.e).map(y=>y.S+' '+y.V+' '+y.X+'.'),3)]),a:full});
if(t=='soggetto')return Z('c','Trova il soggetto',em+'<b>___ '+x.V+' '+x.X+'.</b>',{o:sh([x.S,...pk(['Io','Tu','Lui','Noi','Voi','Loro'].filter(s=>cl(s)!=cl(x.S)),3)]),a:x.S,n:'il verbo «'+x.V+'» si usa con «'+x.S+'»'});
if(t=='espansione')return Z('c','Scegli l’espansione',em+'<b>'+x.S+' '+x.V+' ___.</b><br><small>'+TL[x.T]+'</small>',{o:sh([x.X,...pk(B.filter(y=>y.T!=x.T).map(y=>y.X),3)]),a:x.X,n:'«'+x.X+'» risponde alla domanda «'+TL[x.T]+'»'})}
function menu(){const c0=$('#cfg');c0.innerHTML='';MENU.forEach(g=>{cfg[g.k]=cfg[g.k]||g.o[0][0];const d=document.createElement('div');d.innerHTML='<h2>'+g.t+'</h2>';const c=document.createElement('div');c.className='chips';g.o.forEach(([v,l])=>{const b=document.createElement('button');b.className='chip'+(cfg[g.k]==v?' on':'');b.textContent=l;b.onclick=()=>{cfg[g.k]=v;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};c.appendChild(b)});d.appendChild(c);c0.appendChild(d)});show('menu')}
function show(id){['menu','play','end'].forEach(x=>$('#'+x).hidden=x!==id)}
function go(){const ts=cfg.tec=='tutte'?TEC.slice(1).map(t=>t[0]):[cfg.tec],items=[];B.filter(x=>cfg.tema=='tutti'||x.c==cfg.tema).forEach(x=>ts.forEach(t=>{const q=mk(x,t);if(q)items.push(q)}));Q=sh(items).slice(0,cfg.tec=='tutte'?12:10);i=0;sc=0;er=[];show('play');nx()}
function dn(g,q){snd(g);if(g)sc++;else er.push(q.f);$('#sc').textContent='⭐ '+sc;const f=$('#fb');f.className='fb '+(g?'g':'b');f.textContent=(g?'✅ Giusto! ':'❌ La risposta giusta è: ')+q.f+(q.n?' — '+q.n:'');$('#next').hidden=false;i++}
function bt(txt,cls,fn,p){const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;p.appendChild(b);return b}
function nx(){if(i>=Q.length)return fin();const q=Q[i],a=$('#area');$('#bar').style.width=(i/Q.length*100)+'%';$('#cnt').textContent=(i+1)+' / '+Q.length;$('#sc').textContent='⭐ '+sc;$('#tag').textContent=q.t;$('#prompt').innerHTML=q.h;$('#fb').textContent='';$('#fb').className='fb';$('#next').hidden=true;a.innerHTML='';
if(q.k=='c'){const o=document.createElement('div');o.id='opts';a.appendChild(o);q.o.forEach(t=>bt(t,'opt',function(){[...o.children].forEach(x=>{x.disabled=true;if(x.textContent==q.a)x.classList.add('ok')});const g=t==q.a;if(!g)this.classList.add('ko');dn(g,q)},o))}
if(q.k=='w'){const n=document.createElement('input');n.id='ans';n.autocomplete='off';n.autocapitalize='none';n.placeholder='Scrivi qui';a.appendChild(n);const b=bt('Controlla','btn',()=>{if(!n.value.trim())return;n.disabled=true;b.hidden=true;const g=n.value.trim().toLowerCase()==q.a.toLowerCase();n.style.borderColor=g?'var(--ok)':'var(--ko)';dn(g,q)},a);n.onkeydown=e=>{if(e.key=='Enter')b.click()};n.focus()}
if(q.k=='o'){const tk=sh(q.w.map((w,j)=>({w:w,j:j})));let ln=[];const tr=document.createElement('div'),li=document.createElement('div');tr.className='tray';li.className='tray';a.append(tr,li);const ck=bt('Controlla','btn',()=>{ck.hidden=true;[...a.querySelectorAll('.wd')].forEach(x=>x.disabled=true);const g=ln.map(t=>t.w).join(' ')==q.a;li.style.borderColor=g?'var(--ok)':'var(--ko)';dn(g,q)},a);
const dr=()=>{tr.innerHTML='';li.innerHTML='';tk.filter(t=>!ln.includes(t)).forEach(t=>bt(t.w,'wd',()=>{ln.push(t);dr()},tr));ln.forEach(t=>bt(t.w,'wd',()=>{ln=ln.filter(z=>z!==t);dr()},li));ck.disabled=ln.length!=tk.length};dr()}}
function fin(){show('end');$('#res').textContent=sc+' su '+Q.length;$('#msg').textContent=sc>=Q.length*.9?'Bravissimo!':sc>=Q.length*.6?'Bene! Ancora un po’ di allenamento.':'Riprova: vai piano e rileggi la frase.';$('#errs').innerHTML=er.length?'<h2>Da ripassare</h2><ul>'+[...new Set(er)].map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}
$('#go').onclick=go;$('#next').onclick=nx;$('#again').onclick=go;$('#home').onclick=menu;$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔕 Suoni':'🔔 Suoni'};
menu();
</script></body></html>
