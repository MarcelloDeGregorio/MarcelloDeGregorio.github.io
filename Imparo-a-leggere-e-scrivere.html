if(ty=='scompl'){const ex=!!y.X,a=ex?y.X:y.V;return Z('c','Completa la frase',em(y.e)+'<div class="WD">'+KS(y.S+' '+(ex?y.V+' ___':'___'))+'</div>',{o:sh([a,...pk(ot.map(z=>ex?z.X:z.V).filter(z=>z!=a),3)].map(K)),a:K(a),f:KS(full)+'.',sz:'1.5rem'})}
const who=Math.random()<.5,a=who?y.S:y.V,F=who?nm:K;return Z('c',who?'Chi?':'Che cosa fa?','<div class="WD" style="font-size:1.8rem">'+KS(full)+'.</div>'+em(y.e),{o:sh([a,...pk(bk.map(z=>who?z.S:z.V).filter(z=>z!=a),3)].map(F)),a:F(a),f:F(a)+(who?' è il soggetto':' è il verbo'),sz:'1.6rem',n:who?'il soggetto è chi fa l’azione':'il verbo dice che cosa fa'})}
